name: Build APK - كات ليست محمد عادل

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # لازم عشان إنشاء Release عند عمل tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/CutList-Mohamed-Adel.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CutList-Mohamed-Adel-apk
          path: dist/CutList-Mohamed-Adel.apk

      - name: Publish GitHub Release (يظهر في تبويب Releases مع كل بناء)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: كات ليست محمد عادل - ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('بناء رقم {0}', github.run_number) }}
          body: "نسخة جاهزة للتثبيت: نزّل ملف CutList-Mohamed-Adel.apk من الأسفل."
          make_latest: true
          files: dist/CutList-Mohamed-Adel.apk
